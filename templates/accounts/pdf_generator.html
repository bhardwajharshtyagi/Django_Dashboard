{% extends "base.html" %}

{% block title %}
    PDF Generator
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-sm border-0">

                <div class="card-header py-3">
                    <h3 class="mb-0">
                        📄 PDF Generator
                    </h3>
                </div>

                <div class="card-body p-4">

                    <p class="text-muted mb-4">
                        Paste your text below and generate a downloadable PDF.
                    </p>

                    <form
                        method="POST"
                        action="{% url 'pdf_generator' %}"
                    >

                        {% csrf_token %}

                        <!-- TITLE -->

                        <div class="mb-4">

                            <label
                                for="title"
                                class="form-label fw-bold"
                            >
                                Document Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                name="title"
                                class="form-control"
                                placeholder="Enter document title"
                                value="Generated Document"
                                required
                            >

                        </div>


                        <!-- TEXT -->

                        <div class="mb-4">

                            <label
                                for="text"
                                class="form-label fw-bold"
                            >
                                Paste Your Text
                            </label>

                            <textarea
                                id="text"
                                name="text"
                                class="form-control"
                                rows="20"
                                placeholder="Paste your text here..."
                                required
                            ></textarea>

                            <div class="form-text">
                                You can paste text copied from Google,
                                websites, documents, notes, etc.
                            </div>

                        </div>


                        <!-- BUTTON -->

                        <div class="d-flex justify-content-end">

                            <button
                                type="submit"
                                class="btn btn-dark px-4 py-2"
                            >
                                📄 Generate PDF
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
