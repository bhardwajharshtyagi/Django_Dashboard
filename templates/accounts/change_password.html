{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow p-4 mx-auto" style="max-width:500px;">

<h2 class="text-center mb-4">
Change Password
</h2>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary w-100">
Change Password
</button>

</form>

</div>

</div>

{% endblock %}
